<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Aamir — Java Backend Developer</title>
<desc id="desc">A dark terminal-inspired profile banner highlighting Java, Spring Boot, Spring Security, REST APIs, and selected backend projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#071827"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162238" stop-opacity=".82"/><stop offset="1" stop-color="#0b1423" stop-opacity=".72"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="frame"><rect x="12" y="12" width="1156" height="586" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
