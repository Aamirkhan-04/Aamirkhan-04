  <text x="58" y="478" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Building reliable APIs &amp; secure services.</text>
  <text x="58" y="535" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">~/profile $</text>
  <text x="137" y="535" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">build --ship</text>
  <rect x="220" y="525" width="7" height="14" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

