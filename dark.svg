    <rect x="582" y="341" width="120" height="27" rx="7" fill="#083344" stroke="#22d3ee" stroke-opacity=".65"/><text x="642" y="358" fill="#a5f3fc" text-anchor="middle">Spring Boot</text>
    <rect x="711" y="341" width="137" height="27" rx="7" fill="#083344" stroke="#22d3ee" stroke-opacity=".65"/><text x="779.5" y="358" fill="#a5f3fc" text-anchor="middle">Spring Security</text>
    <rect x="857" y="341" width="100" height="27" rx="7" fill="#052e2b" stroke="#10b981" stroke-opacity=".65"/><text x="907" y="358" fill="#a7f3d0" text-anchor="middle">REST APIs</text>
    <rect x="966" y="341" width="80" height="27" rx="7" fill="#172554" stroke="#6366f1" stroke-opacity=".65"/><text x="1006" y="358" fill="#c7d2fe" text-anchor="middle">JPA</text>
    <rect x="490" y="377" width="98" height="27" rx="7" fill="#172554" stroke="#6366f1" stroke-opacity=".65"/><text x="539" y="394" fill="#c7d2fe" text-anchor="middle">Hibernate</text>
    <rect x="597" y="377" width="85" height="27" rx="7" fill="#052e2b" stroke="#10b981" stroke-opacity=".65"/><text x="639.5" y="394" fill="#a7f3d0" text-anchor="middle">MySQL</text>
    <rect x="691" y="377" width="87" height="27" rx="7" fill="#1e293b" stroke="#64748b" stroke-opacity=".7"/><text x="734.5" y="394" fill="#e2e8f0" text-anchor="middle">Postman</text>
    <rect x="787" y="377" width="94" height="27" rx="7" fill="#1e293b" stroke="#64748b" stroke-opacity=".7"/><text x="834" y="394" fill="#e2e8f0" text-anchor="middle">Git/GitHub</text>
  </g>
  <text x="490" y="434" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">SELECTED BUILD</text>
