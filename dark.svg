  <circle cx="498" cy="465" r="3" fill="#34d399"/>
  <text x="511" y="469" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Customer Support CRM</text>
  <text x="511" y="486" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Ticket workflows · JWT authentication · role-based access</text>
  <circle cx="498" cy="510" r="3" fill="#22d3ee"/>
  <text x="511" y="514" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Student Course Portal</text>
  <text x="511" y="531" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Academic project · course and student management</text>
  <text x="490" y="558" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Mumbai, India</text>
  <text x="1120" y="558" text-anchor="end" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">JAVA • SPRING • SQL</text>
